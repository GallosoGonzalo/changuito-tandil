<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 245" fill="none">
  <!-- Two-ink market print. The dark ink matches the paper of the masthead. -->
  <defs>
    <clipPath id="front"><path d="m85 128 173 23-14 67-134-19z"/></clipPath>
    <clipPath id="side"><path d="m264 151 87-20-22 65-78 22z"/></clipPath>
  </defs>
  <!-- The low sierras, printed in a quieter register behind the basket. -->
  <g stroke="#779b71" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m8 147 24-8 15-9 22-7 13-10 8 1 12-8 12 4 16 12 20 7M23 155l26-8 18-8 13-2"/>
    <path d="m303 116 19-8 14-12 13-4 9-11 10-3 9 4 10 12 17 8 24 6M353 108l15-9 9-1 11 4"/>
  </g>
  <!-- Contents rise from the open lip; all large shapes use flat ink. -->
  <g stroke="#163c2b" stroke-width="3" stroke-linejoin="round">
    <path d="m82 124 91-23 184 23-95 27z" fill="#163c2b" stroke="#c9e69b" stroke-width="4"/>
    <!-- A narrow sesame loaf: cut marks are negative-space shapes. -->
    <g transform="rotate(26 255 87)">
      <path d="M237 154c-2-27-2-59 0-91 2-26 5-47 14-55 7-7 16-4 20 5 7 15 4 48 1 76l-6 67z" fill="#f3eedb"/>
      <g fill="#163c2b" stroke="none">
        <path d="M239 47c1-10 8-19 21-22-2 6-9 14-21 22Zm-2 24c1-10 11-20 24-22-4 8-13 16-24 22Zm-1 25c2-12 13-20 24-22-4 8-13 18-24 22Zm0 24c3-11 13-19 24-20-4 8-14 16-24 20Z"/>
        <path d="m266 35 2-6 1 2-2 5zm1 25 2-5 1 2-2 4zm-2 21 2-5 2 1-3 5zm-1-36 2-4 1 1-2 4z"/>
      </g>
    </g>
    <!-- Folded gable and a single graphic band identify the milk carton. -->
    <g transform="rotate(-10 150 108)">
      <path d="m120 56 2-12 39 1-1 11 11 16 3 64-57-3-1-63z" fill="#f3eedb"/>
      <path d="m120 56 40 1 11 15-43-2z" fill="#c9e69b"/>
      <path d="m120 56 8 14-12 1z" fill="#163c2b"/>
      <path d="m128 70 1 63m-7-82 38 1" stroke-width="2"/>
      <path d="m118 87 11-1 42 2 1 25-42-2-12 2z" fill="#163c2b" stroke="none"/>
      <path d="M151 90c-2 6-8 9-8 13 0 6 11 8 13 2 2-4-3-9-5-15Z" fill="#c9e69b" stroke="none"/>
    </g>
    <!-- Stacked leaves; the ribs serve as a second cut through the ink. -->
    <path d="M208 143c-9-13-24-19-34-32-11-14-9-27-7-34 8 3 14 10 18 16-6-20-2-40 6-51 12 12 17 26 17 44 6-19 18-32 33-38 2 21-8 40-20 51 8-6 17-10 26-11-4 16-15 27-29 38l-2 19z" fill="#c9e69b"/>
    <g stroke-width="2.8" stroke-linecap="round">
      <path d="M212 132c0-25 10-50 20-66m-21 57c-3-16-10-43-17-64m12 65c-8-13-18-25-28-34"/>
    </g>
    <!-- Fruit and the five pointed calyx. -->
    <path d="M279 111c12-15 26-13 33-9 13-5 33 3 34 21 0 16-13 31-33 31-22 0-41-10-40-27 0-6 2-12 6-16Z" fill="#c9e69b"/>
    <path d="m308 107-14-4 10 8-10 6 15-4 7 9-1-11 14-3-13-2 4-9-10 8 1-11-3 1z" fill="#163c2b" stroke="none"/>
    <path d="M279 129c1 8 6 11 10 13" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- Bent steel handle; the contrasting underprint keeps it legible over food. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="m135 135 36-92q3-8 11-7l49 7q7 1 10 8l33 96" stroke="#163c2b" stroke-width="9"/>
    <path d="m135 135 36-92q3-8 11-7l49 7q7 1 10 8l33 96" stroke="#c9e69b" stroke-width="4.5"/>
    <path d="m187 36 35 5" stroke="#163c2b" stroke-width="10"/>
    <path d="m187 36 35 5" stroke="#f3eedb" stroke-width="7"/>
  </g>
  <!-- Tapered wire panels, faceted rather than softly shaded. -->
  <path d="m81 125 180 24 95-22-24 71-84 24-141-20z" fill="#163c2b" stroke="#c9e69b" stroke-width="4.5" stroke-linejoin="round"/>
  <g clip-path="url(#front)" stroke="#c9e69b" stroke-width="3.5">
    <path d="m99 121 25 86m0-83 20 86m5-82 15 85m10-82 10 85m15-82 5 85m20-81 0 84m24-81-6 84M80 149l183 25m-175-1 170 23"/>
  </g>
  <g clip-path="url(#side)" stroke="#94b675" stroke-width="3">
    <path d="m282 141-16 80m37-85-19 80m40-85-21 79m41-80-21 75m-68-30 100-26m-103 50 98-27"/>
  </g>
  <path d="m261 151-13 70" stroke="#c9e69b" stroke-width="4"/>
  <path d="m79 122 183 24 96-22-2 8-94 23-181-25z" fill="#f3eedb" stroke="#163c2b" stroke-width="2.6" stroke-linejoin="round"/>
  <g fill="#163c2b" stroke="#f3eedb" stroke-width="2.4">
    <circle cx="135" cy="134" r="4.8"/><circle cx="274" cy="147" r="4.8"/>
  </g>
  <g stroke="#779b71" stroke-width="1.6" stroke-linecap="round">
    <path d="m100 203 40 6m82 18 26 4 48-14m-29 14 19-5"/>
  </g>
</svg>
